<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard — Kata &amp; Arti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- lapisan hujan (petal/gambar1.png berjatuhan) -->
  <div id="rain-layer" class="rain-layer" aria-hidden="true"></div>

  <!-- lapisan splash (cipratan saat klik) -->
  <div id="splash-layer" class="splash-layer" aria-hidden="true"></div>

  <main class="stage">

    <!-- ===== bar atas: edit + counter ===== -->
    <div class="topbar">
      <button id="editBtn" class="edit-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span id="editBtnLabel">EDIT</span>
      </button>
      <div class="counter"><span id="counterCurrent">01</span> / <span id="counterTotal">20</span></div>
    </div>

    <!-- ===== kartu ===== -->
    <div class="card-wrap">
      <button class="side-nav side-nav--left" id="prevIconBtn" type="button" aria-label="Kartu sebelumnya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="card" id="card">
        <div class="card-back-shadow" id="cardBackShadow" aria-hidden="true"></div>
        <div class="card-flip" id="cardFlip">
          <div class="card-face card-face--front" id="faceKata">
            <span class="eyebrow">KATA</span>
            <span class="word" id="wordKata">Butterfly</span>
          </div>
          <div class="card-face card-face--back" id="faceArti">
            <span class="eyebrow">ARTI</span>
            <span class="word" id="wordArti">Kupu-kupu</span>
          </div>
        </div>
      </div>

      <button class="side-nav side-nav--right" id="nextIconBtn" type="button" aria-label="Kartu berikutnya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <!-- kolom kontrol khusus mode landscape mobile -->
      <div class="side-controls" id="sideControls">
        <button class="side-circle" id="scPrev" type="button" aria-label="Kartu sebelumnya">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="side-circle side-circle--accent" id="scToggle" type="button" aria-label="Ganti mode urutan">
          <svg class="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <svg class="icon-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="side-circle" id="scNext" type="button" aria-label="Kartu berikutnya">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- ===== tombol bawah (desktop & portrait) ===== -->
    <div class="controls" id="controls">
      <button class="pill" id="backBtn" type="button">‹ Back</button>
      <button class="pill pill--accent" id="shuffleBtn" type="button">Acak</button>
      <button class="pill" id="nextBtn" type="button">Next ›</button>
    </div>

  </main>

  <!-- ===== overlay edit ===== -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 class="modal-title">Edit Flashcard</h2>
      <p class="modal-desc">Masukkan kata baru. Kata dan artinya dipisah dengan tanda koma. Untuk kata baru dipisah dengan baris baru.</p>
      <textarea id="editArea" class="modal-textarea" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="pill pill--ghost" id="cancelBtn" type="button">Batal</button>
        <button class="pill pill--solid" id="saveBtn" type="button">Simpan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
